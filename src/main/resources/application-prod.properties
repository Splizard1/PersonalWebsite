# Production overrides — all sensitive values must be set as environment variables

# DataSource (no defaults — app will refuse to start if these are missing)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate — validate schema only, never modify it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

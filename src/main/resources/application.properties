spring.application.name=PersonalWebsite

# DataSource — set env vars in production, defaults are for local dev only
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:personalwebsite}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Admin bootstrap — ADMIN_PASSWORD has no default, must always be set explicitly
app.admin.username=${ADMIN_USERNAME:scott}
app.admin.email=${ADMIN_EMAIL:scott@example.com}
app.admin.password=${ADMIN_PASSWORD}
